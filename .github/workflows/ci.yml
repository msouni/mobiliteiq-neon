name: MobiliteIQ CI et paquet valide
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobiliteiq
          POSTGRES_PASSWORD: test_ci_only
          POSTGRES_DB: mobiliteiq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: mobiliteiq
      PGPASSWORD: test_ci_only
      PGDATABASE: mobiliteiq_test
      RUN_PG_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q mobiliteiq
      - run: python -m pytest -q
      - name: Figer les versions et construire le paquet
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -m pip freeze > requirements-lock.txt
          mkdir -p dist
          git archive --format=tar HEAD > dist/mobiliteiq-release.tar
          tar -rf dist/mobiliteiq-release.tar requirements-lock.txt
          sha256sum dist/mobiliteiq-release.tar > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: mobiliteiq-release
          path: dist/
